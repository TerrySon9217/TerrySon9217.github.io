<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="영상 디자이너 연락처">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Contact | 이름</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Css Styles -->
    <link rel="stylesheet" href="css/bootstrap.min.css" type="text/css">
    <link rel="stylesheet" href="css/font-awesome.min.css" type="text/css">
    <link rel="stylesheet" href="css/elegant-icons.css" type="text/css">
    <link rel="stylesheet" href="css/owl.carousel.min.css" type="text/css">
    <link rel="stylesheet" href="css/magnific-popup.css" type="text/css">
    <link rel="stylesheet" href="css/slicknav.min.css" type="text/css">
    <link rel="stylesheet" href="css/style.css" type="text/css">

    <!-- Contact 페이지 전용 스타일 -->
    <style>
        .contact__intro {
            text-align: center;
            margin-bottom: 50px;
        }

        .contact__intro h3 {
            color: #ffffff;
            font-weight: 700;
            margin-bottom: 14px;
        }

        .contact__intro p {
            color: #adadad;
        }

        .contact__card {
            display: block;
            text-align: center;
            padding: 40px 20px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: border-color 0.3s;
        }

        .contact__card:hover {
            border-color: #00bfe7;
            text-decoration: none;
        }

        .contact__card i {
            font-size: 30px;
            color: #00bfe7;
            margin-bottom: 18px;
        }

        .contact__card h5 {
            color: #ffffff;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .contact__card span {
            color: #adadad;
            font-size: 15px;
            word-break: break-all;
        }
    </style>
</head>

<body>
    <!-- Page Preloder -->
    <div id="preloder">
        <div class="loader"></div>
    </div>

    <!-- Header Section Begin -->
    <header class="header">
        <div class="container">
            <div class="row">
                <div class="col-lg-2">
                    <div class="header__logo">
                        <a href="./index.html"><img src="img/logo.png" alt="로고"></a>
                    </div>
                </div>
                <div class="col-lg-10">
                    <div class="header__nav__option">
                        <nav class="header__nav__menu mobile-menu">
                            <ul>
                                <li><a href="./index.html">Portfolio</a></li>
                                <li><a href="./about.html">About</a></li>
                                <li class="active"><a href="./contact.html">Contact</a></li>
                            </ul>
                        </nav>
                        <div class="header__nav__social">
                            <a href="#"><i class="fa fa-vimeo"></i></a>
                            <a href="#"><i class="fa fa-youtube-play"></i></a>
                            <a href="#"><i class="fa fa-instagram"></i></a>
                        </div>
                    </div>
                </div>
            </div>
            <div id="mobile-menu-wrap"></div>
        </div>
    </header>
    <!-- Header End -->

    <!-- Breadcrumb Begin -->
    <div class="breadcrumb-option spad set-bg" data-setbg="img/breadcrumb-bg.jpg">
        <div class="container">
            <div class="row">
                <div class="col-lg-12 text-center">
                    <div class="breadcrumb__text">
                        <h2>Contact</h2>
                        <div class="breadcrumb__links">
                            <a href="./index.html">Portfolio</a>
                            <span>Contact</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Breadcrumb End -->

    <!-- Contact Section Begin -->
    <section class="spad">
        <div class="container">
            <div class="contact__intro">
                <h3>Let's work together</h3>
                <p>작업 문의나 협업 제안은 아래 연락처로 보내주세요.</p>
            </div>
            <div class="row justify-content-center">
                <!-- 카드 하나가 연락 수단 하나입니다. href 와 글자를 본인 것으로 바꾸세요. -->
                <div class="col-lg-4 col-md-6">
                    <a href="mailto:your@email.com" class="contact__card">
                        <i class="fa fa-envelope-o"></i>
                        <h5>Email</h5>
                        <span>your@email.com</span>
                    </a>
                </div>
                <div class="col-lg-4 col-md-6">
                    <a href="#" target="_blank" rel="noopener" class="contact__card">
                        <i class="fa fa-instagram"></i>
                        <h5>Instagram</h5>
                        <span>@your_account</span>
                    </a>
                </div>
                <div class="col-lg-4 col-md-6">
                    <a href="#" target="_blank" rel="noopener" class="contact__card">
                        <i class="fa fa-vimeo"></i>
                        <h5>Vimeo</h5>
                        <span>vimeo.com/your_account</span>
                    </a>
                </div>
            </div>
        </div>
    </section>
    <!-- Contact Section End -->

    <!-- Footer Section Begin -->
    <footer class="footer">
        <div class="container">
            <div class="footer__top">
                <div class="row">
                    <div class="col-lg-6 col-md-6">
                        <div class="footer__top__logo">
                            <a href="./index.html"><img src="img/logo.png" alt="로고"></a>
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-6">
                        <div class="footer__top__social">
                            <a href="#"><i class="fa fa-vimeo"></i></a>
                            <a href="#"><i class="fa fa-youtube-play"></i></a>
                            <a href="#"><i class="fa fa-instagram"></i></a>
                        </div>
                    </div>
                </div>
            </div>
            <div class="footer__copyright">
                <div class="row">
                    <div class="col-lg-12 text-center">
                        <!-- Link back to Colorlib can't be removed. Template is licensed under CC BY 3.0. -->
                        <p class="footer__copyright__text">Copyright &copy;
                            <script>
                                document.write(new Date().getFullYear());
                            </script>
                            All rights reserved | This template is made with <i class="fa fa-heart-o"
                                aria-hidden="true"></i> by <a href="https://colorlib.com" target="_blank">Colorlib</a>
                        </p>
                        <!-- Link back to Colorlib can't be removed. Template is licensed under CC BY 3.0. -->
                    </div>
                </div>
            </div>
        </div>
    </footer>
    <!-- Footer Section End -->

    <!-- Js Plugins -->
    <script src="js/jquery-3.3.1.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/jquery.magnific-popup.min.js"></script>
    <script src="js/mixitup.min.js"></script>
    <script src="js/masonry.pkgd.min.js"></script>
    <script src="js/jquery.slicknav.js"></script>
    <script src="js/owl.carousel.min.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
